[package]
name = "dfplayer-esp32"
version = "0.3.0"
edition = "2024"
description = "A library for communicating with the DFPlayer Mini module"
keywords = ["dfplayer", "esp32", "IoT"]
license = "MIT"
repository = "https://github.com/crazydw4rf/dfplayer-esp32"

[dependencies]
esp-idf-hal = "0.47"
thiserror = "2.0"
log = "0.4"
derive_more = { version = "2.1", features = ["try_from", "deref", "from"] }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[lints.clippy]
todo = "warn"
unimplemented = "warn"
